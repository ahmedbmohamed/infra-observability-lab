---
# blackbox_exporter probes the HTTPS endpoints from the inside: is the site up, is the certificate valid,
# when does it expire. Prometheus tells it what to probe (see terraform/templates/prometheus.yml.tftpl).
- name: Create the blackbox_exporter system user
  ansible.builtin.user:
    name: blackbox_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download blackbox_exporter (checksum verified)
  ansible.builtin.get_url:
    url: "{{ blackbox_exporter_url }}"
    dest: "/opt/blackbox_exporter-{{ blackbox_exporter_version }}.tar.gz"
    checksum: "sha256:{{ blackbox_exporter_sha256 }}"
    mode: "0644"

- name: Unpack blackbox_exporter
  ansible.builtin.unarchive:
    src: "/opt/blackbox_exporter-{{ blackbox_exporter_version }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64/blackbox_exporter"

- name: Install the blackbox_exporter binary
  ansible.builtin.copy:
    src: "/opt/blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64/blackbox_exporter"
    dest: /usr/local/bin/blackbox_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart blackbox_exporter

- name: Create the configuration folder
  ansible.builtin.file:
    path: "{{ blackbox_exporter_dir }}"
    state: directory
    owner: root
    group: blackbox_exporter
    mode: "0750"

# The certificate folder of the server is root-only, so the exporter gets its own copy of the CA (public).
- name: Give the exporter the lab CA certificate
  ansible.builtin.copy:
    src: "{{ pki_dir }}/ca.crt"
    dest: "{{ blackbox_exporter_dir }}/ca.crt"
    owner: root
    group: blackbox_exporter
    mode: "0644"
  notify: Restart blackbox_exporter

- name: Configure the probe modules
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ blackbox_exporter_dir }}/blackbox.yml"
    owner: root
    group: blackbox_exporter
    mode: "0640"
  notify: Restart blackbox_exporter

- name: Run blackbox_exporter under supervisor
  ansible.builtin.template:
    src: blackbox_exporter.conf.j2
    dest: /etc/supervisor/conf.d/blackbox_exporter.conf
    owner: root
    group: root
    mode: "0644"
  notify: Update supervisor
