---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Apply global hardening settings
  ansible.builtin.template:
    src: hardening.conf.j2
    dest: /etc/nginx/conf.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Publish the status page for the exporter
  ansible.builtin.template:
    src: status.conf.j2
    dest: /etc/nginx/conf.d/status.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

# On the edge, the edge role installs its own site instead (nginx_lab_site: false).
- name: Configure the origin site
  when: nginx_lab_site
  block:
    - name: Map the edge client certificate to $origin_pull_ok
      ansible.builtin.template:
        src: origin-pull.conf.j2
        dest: /etc/nginx/conf.d/origin-pull.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Configure the HTTPS site
      ansible.builtin.template:
        src: lab-site.conf.j2
        dest: /etc/nginx/sites-available/lab.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable the HTTPS site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/lab.conf
        dest: /etc/nginx/sites-enabled/lab.conf
        state: link
      notify: Reload nginx

    - name: Create the site folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ nginx_site_root }}"
        - "{{ nginx_site_root }}/static"

    - name: Publish the home page and the stylesheet
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ nginx_site_root }}/{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - {src: index.html.j2, dest: index.html}
        - {src: app.css.j2, dest: static/app.css}

# Stops the play here if a template produced an invalid configuration,
# before the reload handler can break a running server.
- name: Check the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Run nginx under supervisor
  ansible.builtin.template:
    src: supervisor-nginx.conf.j2
    dest: /etc/supervisor/conf.d/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: Update supervisor

- name: Install the nginx Prometheus exporter
  ansible.builtin.import_tasks: exporter.yml
