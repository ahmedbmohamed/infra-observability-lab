---
- name: Create the nginx_exporter system user
  ansible.builtin.user:
    name: nginx_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download nginx-prometheus-exporter (checksum verified)
  ansible.builtin.get_url:
    url: "{{ nginx_exporter_url }}"
    dest: "/opt/nginx-prometheus-exporter-{{ nginx_exporter_version }}.tar.gz"
    checksum: "sha256:{{ nginx_exporter_sha256 }}"
    mode: "0644"

- name: Create the exporter folder
  ansible.builtin.file:
    path: "/opt/nginx-prometheus-exporter-{{ nginx_exporter_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack nginx-prometheus-exporter
  ansible.builtin.unarchive:
    src: "/opt/nginx-prometheus-exporter-{{ nginx_exporter_version }}.tar.gz"
    dest: "/opt/nginx-prometheus-exporter-{{ nginx_exporter_version }}"
    remote_src: true
    creates: "/opt/nginx-prometheus-exporter-{{ nginx_exporter_version }}/nginx-prometheus-exporter"

- name: Install the exporter binary
  ansible.builtin.copy:
    src: "/opt/nginx-prometheus-exporter-{{ nginx_exporter_version }}/nginx-prometheus-exporter"
    dest: /usr/local/bin/nginx-prometheus-exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart nginx_exporter

- name: Run the exporter under supervisor
  ansible.builtin.template:
    src: supervisor-nginx-exporter.conf.j2
    dest: /etc/supervisor/conf.d/nginx_exporter.conf
    owner: root
    group: root
    mode: "0644"
  notify: Update supervisor
