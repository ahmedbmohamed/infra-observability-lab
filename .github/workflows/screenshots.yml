name: refresh-screenshots

# Run by hand: builds the lab, runs the alert drill with screenshots and commits them to docs/screenshots.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tools
        run: |
          pip install ansible-core==2.17.* cryptography -r tests/requirements.txt playwright==1.48.*
          ansible-galaxy collection install -r ansible/requirements.yml
          python -m playwright install --with-deps chromium

      - name: Build and configure the lab
        run: make up configure

      - name: Alert drill with screenshots
        run: python tests/alert_drill.py --screenshots docs/screenshots

      - name: Commit the screenshots
        run: |
          git config user.name "Ahmed Benmohamed"
          git config user.email "166703502+ahmedbmohamed@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "Refresh README screenshots"
          git push

      - name: Destroy the lab
        if: always()
        run: make down
